services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - user-mgmt-service-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  user-mgmt-service:
    image: xxpirl2knc5/user_mgmt_service:latest
    networks:
      - user-mgmt-service-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-mgmt-service.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.user-mgmt-service.middlewares=user-mgmt-strip-api"
      - "traefik.http.middlewares.user-mgmt-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.user-mgmt-service.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: 3600000
  postgres:
    image: postgres:16-alpine
    networks:
      - user-mgmt-service-network
    restart: always
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  user-mgmt-service-network:
