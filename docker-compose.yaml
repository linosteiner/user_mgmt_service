services:
  traefik:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - user-mgmt-service-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - letsencrypt-data:/letsencrypt
    labels:
      - "traefik.enable=true"
      # Dashboard - served on its own entrypoint so it never competes with
      # the backend's Host()+PathPrefix(/api) router on web/websecure.
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  user-mgmt-service:
    image: xxpirl2knc5/user_mgmt_service:latest
    networks:
      - user-mgmt-service-network
    labels:
      - "traefik.enable=true"
      # HTTP router - redirects to HTTPS
      - "traefik.http.routers.user-mgmt-service-web.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-mgmt-service-web.entrypoints=web"
      - "traefik.http.routers.user-mgmt-service-web.middlewares=redirect-to-https"
      - "traefik.http.routers.user-mgmt-service-web.priority=10"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTPS router - actual service traffic
      - "traefik.http.routers.user-mgmt-service.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-mgmt-service.entrypoints=websecure"
      - "traefik.http.routers.user-mgmt-service.tls=true"
      - "traefik.http.routers.user-mgmt-service.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user-mgmt-service.middlewares=user-mgmt-strip-api"
      - "traefik.http.routers.user-mgmt-service.priority=10"
      - "traefik.http.middlewares.user-mgmt-strip-api.stripprefix.prefixes=/api"

      - "traefik.http.services.user-mgmt-service.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: 3600000
  auth-portal:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${TRAEFIK_HOST}/api
    image: xxpirl2knc5/auth_portal:latest
    networks:
      - user-mgmt-service-network
    labels:
      - "traefik.enable=true"
      # HTTP router - redirects to HTTPS
      - "traefik.http.routers.auth-portal-web.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.auth-portal-web.entrypoints=web"
      - "traefik.http.routers.auth-portal-web.middlewares=redirect-to-https"
      - "traefik.http.routers.auth-portal-web.priority=1"

      # HTTPS router - actual service traffic
      - "traefik.http.routers.auth-portal.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.auth-portal.entrypoints=websecure"
      - "traefik.http.routers.auth-portal.tls=true"
      - "traefik.http.routers.auth-portal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auth-portal.priority=1"

      - "traefik.http.services.auth-portal.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    networks:
      - user-mgmt-service-network
    restart: always
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  user-mgmt-service-network:

volumes:
  letsencrypt-data:
