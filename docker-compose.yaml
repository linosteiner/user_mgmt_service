services:
  traefik:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "443:443"
    networks:
      - user-mgmt-service-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - letsencrypt-data:/letsencrypt

  user-mgmt-service:
    image: xxpirl2knc5/user_mgmt_service:latest
    networks:
      - user-mgmt-service-network
    labels:
      - "traefik.enable=true"
      # HTTP router - redirects to HTTPS
      - "traefik.http.routers.user-mgmt-service-web.rule=Host(`vcs.linosteiner.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-mgmt-service-web.entrypoints=web"
      - "traefik.http.routers.user-mgmt-service-web.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTPS router - actual service traffic
      - "traefik.http.routers.user-mgmt-service.rule=Host(`vcs.linosteiner.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-mgmt-service.entrypoints=websecure"
      - "traefik.http.routers.user-mgmt-service.tls=true"
      - "traefik.http.routers.user-mgmt-service.tls.certresolver=letsencrypt"
      - "traefik.http.routers.user-mgmt-service.middlewares=user-mgmt-strip-api"
      - "traefik.http.middlewares.user-mgmt-strip-api.stripprefix.prefixes=/api"

      - "traefik.http.services.user-mgmt-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.user-mgmt-service-web.middlewares=user-mgmt-strip-api"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: 3600000
  postgres:
    image: postgres:16-alpine
    networks:
      - user-mgmt-service-network
    restart: always
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  user-mgmt-service-network:

volumes:
  letsencrypt-data:
