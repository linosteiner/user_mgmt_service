spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}

# INFO, not DEBUG: this image runs in staging and prod. At DEBUG every request writes dozens of
# lines (security filter chain, Hibernate, Tomcat), and under the k6 load test that logging
# competes for the same CPU the HPA scales on -- the test would partly measure the logger. For local debugging set LOGGING_LEVEL_ROOT=DEBUG and SPRING_JPA_SHOW_SQL=true in the
# environment; Spring's relaxed binding lets both override this file.
logging.level.root=INFO

# --- Actuator: the endpoints the Kubernetes probes call, and Prometheus scraping ----
#
# On a port of its own, and deliberately so. The application is served under
# server.servlet.context-path=/api, and the Ingress routes the whole /api prefix from the
# internet to this Service -- so an Actuator sharing port 8080 would put /api/actuator/health
# on the public hostname. Port 8081 is in no Ingress: only the kubelet (probes) and
# Prometheus, running in the `monitoring` namespace, reach it -- both in-cluster only, never
# through the public hostname. The Ops repo's NetworkPolicy allows exactly those two.
#
# Note the management context does NOT inherit server.servlet.context-path, so the probe and
# metrics paths are :8081/actuator/health/readiness and :8081/actuator/prometheus -- no /api
# prefix.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# Tags every metric with `application="user-mgmt-service"`, which is what the Ops repo's
# PrometheusRule and the Grafana dashboard both filter on.
management.metrics.tags.application=user-mgmt-service

# Publishes http_server_requests_seconds_bucket in addition to _count/_sum, so Prometheus can
# compute percentiles (histogram_quantile) across all replicas. Without buckets the dashboard
# can only show the average response time, which hides exactly the slow tail a load test is
# looking for.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Details are safe to show BECAUSE of the separate port above: nothing outside the node can
# reach this. It is also what makes a failing probe diagnosable -- the response names the
# indicator that is DOWN instead of just saying DOWN. If the management port is ever merged
# back into 8080, this must go back to `never`.
management.endpoint.health.show-details=always

# readinessState alone only reports whether Spring finished starting. Adding `db` is the
# point of the exercise: a pod whose datasource is gone stops being an endpoint and stops
# receiving traffic, instead of accepting requests it cannot serve. The tradeoff is
# deliberate -- if Postgres is down, every backend pod goes unready and Traefik answers 503
# rather than 500. Liveness deliberately does NOT include the database: a dependency being
# down must not get the container killed and restarted in a loop.
management.endpoint.health.group.readiness.include=readinessState,db
