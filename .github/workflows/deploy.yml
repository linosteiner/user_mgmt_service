name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME_LIST: xxpirl2knc5/user_mgmt_service
  IMAGE_NAME_LEBE: bernetlennard/user_mgmt_service

jobs:
  build-and-push-lebe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LEBE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LEBE }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME_LEBE }}:latest
            ${{ env.IMAGE_NAME_LEBE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lebe:
    needs: build-and-push-lebe
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST_LEBE }}
          username: ${{ secrets.DROPLET_USERNAME_LEBE }}
          key: ${{ secrets.DROPLET_SSH_KEY_LEBE }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH_LEBE }}
            docker compose pull
            docker compose up -d
            docker image prune -f
