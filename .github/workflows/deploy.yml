name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  IMAGE_NAME: xxpirl2knc5/user_mgmt_service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-list:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy compose files to droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.yaml,traefik.yaml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
            docker image prune -f

  deploy-lebe:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy compose files to droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST_LEBE }}
          username: ${{ secrets.DROPLET_USERNAME_LEBE }}
          key: ${{ secrets.DROPLET_SSH_KEY_LEBE }}
          source: "docker-compose.yaml,traefik.yaml"
          target: ${{ secrets.DEPLOY_PATH_LEBE }}

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST_LEBE }}
          username: ${{ secrets.DROPLET_USERNAME_LEBE }}
          key: ${{ secrets.DROPLET_SSH_KEY_LEBE }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH_LEBE }}
            docker compose pull
            docker compose up -d
            docker image prune -f
