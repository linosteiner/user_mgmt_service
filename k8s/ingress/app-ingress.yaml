# The HTTP routing table: hostnames and paths onto Services. It is only data -- Traefik
# watches these objects and turns them into proxy configuration.
#
# Apply this last: it references the Services by name and Traefik logs errors until
# they exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    # Traefik-specific extensions; the Ingress spec has no fields for these.
    #
    # Serve on the :443 entrypoint only -- plain HTTP is handled by the global redirect
    # in traefik-config.yaml.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Redundant with the `tls:` block below, but Traefik's precedence rules here are
    # subtle enough that it is not worth removing.
    traefik.ingress.kubernetes.io/router.tls: "true"
    # The resolver defined in traefik-config.yaml.
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  # Matches the IngressClass in k8s/traefik/traefik-ingressclass.yaml.
  ingressClassName: traefik
  tls:
    # No `secretName`: Traefik obtains and stores the certificate itself in acme.json
    # on its PVC, so it is not a Kubernetes object and `kubectl get secret` never shows
    # it. Each host gets its own certificate, which is why both are listed here.
    - hosts:
        - vcs.lennardbernet.ch
        - vcs.linosteiner.ch
  rules:
    - host: vcs.lennardbernet.ch
      http:
        paths:
          # Longest matching prefix wins, so /api reaches the backend and everything
          # else falls through to the frontend; the order here does not matter.
          #
          # No stripPrefix: the backend already serves itself under /api
          # (SERVER_SERVLET_CONTEXT_PATH in user-mgmt-config.yaml).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-mgmt-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-portal
                port:
                  number: 3000
    # The same Services again: both hostnames are two doors into the same stack, and a
    # host block cannot reuse another host's paths.
    - host: vcs.linosteiner.ch
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-mgmt-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-portal
                port:
                  number: 3000
