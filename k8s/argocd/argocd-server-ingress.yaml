# The ArgoCD dashboard/API at https://argo.linosteiner.ch, through the same Traefik
# controller and Let's Encrypt resolver as the application. Requires an A record for
# argo.linosteiner.ch pointing at the Traefik LoadBalancer IP, and argocd-cmd-params-cm
# applied first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argo.linosteiner.ch
  rules:
    - host: argo.linosteiner.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
