# Roles for the local accounts declared in argocd-cm.yaml. Without a `g,` line an
# account falls back to `policy.default`, which is unset and means no access.
#
# `role:admin` is built into ArgoCD (unrestricted), so binding to it is enough -- no
# `p,` policy lines needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    g, lennard, role:admin
