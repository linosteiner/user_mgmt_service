# Local ArgoCD accounts, in addition to the built-in `admin`. `login` allows sign-in
# via UI/CLI; permissions come separately from argocd-rbac-cm.yaml.
#
# Merges into the argocd-cm created by the upstream ArgoCD install (not tracked in
# git). Watched at runtime -- no argocd-server restart needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  accounts.lennard: "login"
  accounts.lennard.enabled: "true"
