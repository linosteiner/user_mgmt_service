# Server flags for the ArgoCD install, which itself comes from the upstream manifest
# (argo-cd/stable/manifests/install.yaml) and is not tracked in git.
#
# server.insecure makes argocd-server serve plain HTTP on :8080 instead of terminating
# its own TLS. Required because Traefik terminates TLS -- otherwise its plain-HTTP
# proxy hits argocd-server's TLS listener and the handshake fails.
#
# Apply, then `kubectl rollout restart deployment/argocd-server -n argocd` --
# argocd-server does not watch this ConfigMap at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
