# Runtime configuration for the Next.js frontend.
#
# NEXT_PUBLIC_API_URL is deliberately not here: Next.js inlines NEXT_PUBLIC_* at build
# time, so setting it at runtime has no effect. bernetlennard/auth_portal:latest has
# https://vcs.lennardbernet.ch/api baked in, which means the pod calls that host even
# for visitors arriving on vcs.linosteiner.ch, and changing the backend hostname
# requires rebuilding the image rather than editing this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-portal-config
data:
  # Quoted so YAML cannot reinterpret the values (the classic case being `NO` -> false).
  PORT: "3000"
  NODE_ENV: "production"
