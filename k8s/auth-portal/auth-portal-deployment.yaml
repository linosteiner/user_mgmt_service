# The Next.js frontend. Serves everything that is not /api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-portal
  labels:
    app: auth-portal
spec:
  replicas: 1
  # Recreate instead of RollingUpdate: the node is too small to carry two of these
  # pods at once during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-portal
  template:
    metadata:
      labels:
        app: auth-portal
    spec:
      containers:
        - name: auth-portal
          image: bernetlennard/auth_portal:latest
          # Required with a mutable `:latest` tag -- otherwise a node that already
          # cached an image called :latest reuses the stale one.
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # No renaming needed here, so envFrom pulls in every key of the ConfigMap
          # at once. Compare user-mgmt-deployment.yaml, which cannot use this.
          envFrom:
            - configMapRef:
                name: auth-portal-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # httpGet is possible here (unlike for the backend) because the frontend
          # serves / without authentication. Kubernetes counts any 2xx or 3xx as a
          # pass, so a redirect to /dashboard is still "ready".
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
