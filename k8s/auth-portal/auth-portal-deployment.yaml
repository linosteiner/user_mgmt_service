# The Next.js frontend. Serves everything that is not /api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-portal
  labels:
    app: auth-portal
spec:
  replicas: 1
  # Recreate instead of RollingUpdate: the node is too small to carry two of these
  # pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-portal
  template:
    metadata:
      labels:
        app: auth-portal
    spec:
      containers:
        - name: auth-portal
          image: bernetlennard/auth_portal:latest
          # Required with a mutable `:latest` tag -- otherwise a node that already
          # cached an image called :latest reuses the stale one.
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: auth-portal-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # The frontend serves / without authentication, so an HTTP probe works.
          # Any 2xx or 3xx counts as a pass, so the redirect to /dashboard is fine.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
