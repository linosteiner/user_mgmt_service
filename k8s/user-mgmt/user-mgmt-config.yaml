# Configuration for the Spring Boot backend, as environment variables. Spring's
# relaxed binding maps them onto dotted properties (JWT_EXPIRATION_MILLIS ->
# jwt.expirationMillis), which is why several take effect without appearing in
# src/main/resources/application.properties.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-mgmt-config
data:
  # -> jwt.issuer / jwt.expirationMillis on JwtProperties. 3600000 ms = 1 hour.
  JWT_ISSUER: user-mgmt-service
  JWT_EXPIRATION_MILLIS: "3600000"
  # `update` alters the schema to match the entities and keeps the data.
  # (docker-compose uses `create-drop`, which wipes it on every restart.)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  # The app serves itself under /api, which is why the Ingress needs no stripPrefix
  # (that would require a Traefik Middleware CRD).
  SERVER_SERVLET_CONTEXT_PATH: /api
  # Size the heap against the container limit (700Mi) rather than the node's total RAM.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
