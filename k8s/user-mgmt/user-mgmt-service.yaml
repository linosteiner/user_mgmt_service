# Internal address of the backend: `user-mgmt-service:8080`. The Ingress routes /api
# here by naming this Service. Sharing a name with the Deployment is legal and
# irrelevant -- only the selector below links this Service to the pods.
apiVersion: v1
kind: Service
metadata:
  name: user-mgmt-service
spec:
  type: ClusterIP
  selector:
    app: user-mgmt-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
