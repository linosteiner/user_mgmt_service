# The Spring Boot backend. Serves the REST API under /api (see
# SERVER_SERVLET_CONTEXT_PATH) and talks to Postgres over the cluster-internal
# `postgres` Service name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-mgmt-service
  labels:
    app: user-mgmt-service
spec:
  replicas: 1
  # Recreate instead of RollingUpdate: the node is too small to carry two of these
  # pods at once. Costs a short outage on every deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-mgmt-service
  template:
    metadata:
      labels:
        app: user-mgmt-service
    spec:
      containers:
        - name: user-mgmt-service
          image: xxpirl2knc5/user_mgmt_service:latest
          # Required with a mutable `:latest` tag -- the default IfNotPresent would
          # reuse a stale cached image and the deploy would silently do nothing.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Wired per key rather than with envFrom, because the names change on the way
          # in: the credentials are stored as POSTGRES_* but Spring wants them as
          # SPRING_DATASOURCE_*, and envFrom cannot rename keys.
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            # $(POSTGRES_DB) resolves against the entry declared directly above;
            # `postgres` is the Service name, resolved by cluster DNS.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: JWT_ISSUER
            - name: JWT_EXPIRATION_MILLIS
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: JWT_EXPIRATION_MILLIS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-mgmt-secret
                  key: JWT_SECRET
            - name: SERVER_SERVLET_CONTEXT_PATH
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: SERVER_SERVLET_CONTEXT_PATH
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: JAVA_TOOL_OPTIONS
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # Kept in step with JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 in the
              # ConfigMap: heap tops out around 420Mi, leaving room for the JVM's
              # non-heap memory before the container is OOM-killed.
              memory: 700Mi
          # tcpSocket, so the probes only check that Tomcat has bound its port. The app
          # meanwhile exposes real Actuator probes on :8081 (see application.properties);
          # the Helm chart in the Ops repo uses those, this superseded manifest does not.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          # The long initial delay keeps liveness from killing a slow JVM start and
          # producing an endless CrashLoopBackOff.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
