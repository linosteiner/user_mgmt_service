# -> jwt.secret, the HMAC signing key. Anyone holding it can mint tokens the backend
# accepts, which makes it the most sensitive value in the stack.
#
# Same shortcut as postgres-secret.yaml, but worse: this key is committed in plain text
# and shared with the local .env, so dev and cluster sign with the same key. Real setups
# generate a fresh key per environment and keep it out of the repo.
apiVersion: v1
kind: Secret
metadata:
  name: user-mgmt-secret
type: Opaque
stringData:
  JWT_SECRET: ZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYpZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYpZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYp
