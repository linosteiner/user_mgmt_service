# The HMAC signing key for JWTs. Anyone holding this value can mint tokens that the
# backend accepts as valid -- it is the single most sensitive value in the stack.
#
# HEADS UP -- same learning shortcut as postgres-secret.yaml, but worse here: this key
# is committed to git in plain text AND shared with the local .env file, so the dev
# and cluster environments sign with the same key. In anything real, generate a fresh
# key per environment and keep it out of the repo (Sealed Secrets / External Secrets,
# or `kubectl create secret generic`).
#
# -> jwt.secret on JwtProperties.
apiVersion: v1
kind: Secret
metadata:
  name: user-mgmt-secret
type: Opaque
stringData:
  JWT_SECRET: ZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYpZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYpZbyvykG1tiIAkpdYKrXS0TmIfgkJmmYp
