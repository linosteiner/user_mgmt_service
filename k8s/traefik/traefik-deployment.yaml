# The ingress controller -- the only pod that receives traffic from the internet.
# Everything else is reached through it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the ACME PVC is ReadWriteOnce and cannot be mounted
  # by two pods at once. Costs a brief outage on every rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      # Identity from traefik-rbac.yaml, so Traefik may read Ingresses.
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7
          args:
            - --configFile=/etc/traefik/traefik.yaml
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: dashboard
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: acme
              mountPath: /letsencrypt
          # No CPU limit on purpose: CPU is throttled rather than killed, and a limit
          # would only slow down startup bursts.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          # Traefik is ready as soon as it is listening, so a TCP check is enough.
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
      volumes:
        # Mounted as a volume: the key `traefik.yaml` becomes the file
        # /etc/traefik/traefik.yaml.
        - name: config
          configMap:
            name: traefik-config
        - name: acme
          persistentVolumeClaim:
            claimName: traefik-acme-pvc
