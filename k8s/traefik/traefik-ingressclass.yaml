# The name an Ingress uses to pick its controller: `ingressClassName: traefik` points
# here, and `controller:` names Traefik as the implementation behind it.
#
# Not marked as the cluster default -- every Ingress here names the class explicitly.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
