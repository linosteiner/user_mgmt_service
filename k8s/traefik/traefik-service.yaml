# The public entry point: type LoadBalancer makes DigitalOcean create a real external
# load balancer with a public IP, which is what the DNS A-records point at.
# Ports 80/443 only -- the dashboard on 8080 is deliberately not exposed here.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  annotations:
    # The DigitalOcean default health check (5 x 3s = 15s) takes longer than Traefik's
    # first ACME attempt after a pod start (~9s), so every restart lost that race and
    # the challenge 404'd -- and Traefik does not retry a failed ACME request
    # (traefik#9405). 2 x 3s = 6s wins it reliably.
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "2"
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443
