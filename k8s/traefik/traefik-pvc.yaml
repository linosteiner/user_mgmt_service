# Holds /letsencrypt/acme.json (the TLS certificate and ACME account key). Without it
# every pod restart would request a new certificate and quickly hit Let's Encrypt's
# rate limit of 5 duplicate certs per week.
#
# ReadWriteOnce is why the Deployment uses `strategy: Recreate`.
# 1Gi is far more than acme.json needs, but DigitalOcean bills a 1Gi minimum anyway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-acme-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
