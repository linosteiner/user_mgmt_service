apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"
      traefik:
        address: ":8080"

    api:
      dashboard: true
      insecure: true

    providers:
      kubernetesIngress: {}

    certificatesResolvers:
      letsencrypt:
        acme:
          email: "test@test.ch"
          storage: "/letsencrypt/acme.json"
          # Staging-CA fuer den ersten Durchlauf: Let's Encrypt limitiert auf
          # 5 Fehlversuche/Stunde/Hostname. Erst wenn hier ein Zertifikat
          # ausgestellt wird, diese Zeile entfernen und den Pod neu starten,
          # um ein echtes (browser-vertrauenswuerdiges) Zertifikat zu holen.
          caServer: https://acme-staging-v02.api.letsencrypt.org/directory
          httpChallenge:
            entryPoint: web
