# Traefik's static config, mounted as /etc/traefik/traefik.yaml by the Deployment.
# Traefik reads it once at startup: after `kubectl apply` run
# `kubectl rollout restart deployment/traefik`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
        http:
          # Plain HTTP is 308-redirected to HTTPS. The ACME challenge is exempt --
          # Traefik answers it before applying the redirect.
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"
      traefik:
        address: ":8080"

    api:
      dashboard: true
      # No authentication on the dashboard. Safe only because :8080 is not exposed by
      # the LoadBalancer -- see traefik-dashboard-service.yaml.
      insecure: true

    providers:
      # Routes come from Ingress objects, watched via the Kubernetes API (RBAC in
      # traefik-rbac.yaml).
      kubernetesIngress:
        # Makes Traefik write the LB address into Ingress.status. Without it ArgoCD's
        # Ingress health check stays on "Progressing" forever.
        ingressEndpoint:
          publishedService: "default/traefik"

    certificatesResolvers:
      # Referenced by name from the Ingress annotation `router.tls.certresolver`.
      letsencrypt:
        acme:
          email: "bernet.lennard.privat@gmail.com"
          # On traefik-acme-pvc, so certs survive pod restarts.
          storage: "/letsencrypt/acme.json"
          # HTTP-01: Let's Encrypt calls back on port 80, so it must stay publicly
          # reachable and DNS must point here -- see README, "DNS and the AAAA trap".
          httpChallenge:
            entryPoint: web
