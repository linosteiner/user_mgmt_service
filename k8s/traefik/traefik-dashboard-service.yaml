# The Traefik dashboard, on the same pods as the LoadBalancer Service. Split into its
# own ClusterIP Service so port 8080 is never exposed publicly -- the dashboard runs
# without authentication (`api.insecure: true` in traefik-config.yaml).
#
#   kubectl port-forward svc/traefik-dashboard 8080:8080
#   -> http://localhost:8080/dashboard/
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: dashboard
      port: 8080
      targetPort: 8080
