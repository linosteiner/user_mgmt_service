# Identity and permissions for Traefik, which watches the Kubernetes API for Ingress
# objects instead of reading a static route file. Three objects: ServiceAccount (who),
# ClusterRole (what), ClusterRoleBinding (glue).
#
# Cluster-scoped rather than a plain Role because Traefik must see Ingresses in every
# namespace, and IngressClass has no namespace at all.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  # services + endpointslices: discover the pod IPs behind a Service.
  # secrets: read TLS certs from `spec.tls.secretName`; unused here (Traefik manages
  # its own cert via ACME), but the provider asks for it regardless.
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # The routing rules themselves.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Lets Traefik write the LoadBalancer IP back onto the Ingress status, which is what
  # makes `kubectl get ingress` show an ADDRESS.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    # The one hardcoded namespace in k8s/ -- must change if Traefik moves out of
    # `default`.
    namespace: default
