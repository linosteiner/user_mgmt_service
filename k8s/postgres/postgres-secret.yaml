# The Postgres superuser credentials.
#
# Learning shortcut, not a pattern to copy: a Secret is only base64-encoded, never
# encrypted, and these values are committed in plain text. The real answers are Sealed
# Secrets, External Secrets, or `kubectl create secret generic` and never committing it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
