# Secret: same idea as a ConfigMap, but intended for sensitive values. Kubernetes
# treats it slightly differently (not shown in `kubectl describe`, can be encrypted
# at rest, mounted as tmpfs rather than disk).
#
# HEADS UP -- this file is a learning shortcut, not a pattern to copy:
# a Secret is only base64-ENCODED, never encrypted. `stringData` lets us write plain
# text and have Kubernetes do the base64 for us, which makes the shortcut obvious:
# anyone with repo access, or `kubectl get secret postgres-secret -o yaml`, reads
# these credentials. Committing them to git is the actual problem, not the encoding.
#
# The real answers, roughly in order of complexity:
#   - Sealed Secrets   -- commit an encrypted blob; a controller decrypts it in-cluster.
#   - External Secrets -- keep values in Vault / DO Secrets / AWS SM and sync them in.
#   - `kubectl create secret generic ... --from-literal=...` -- never commit it at all.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
