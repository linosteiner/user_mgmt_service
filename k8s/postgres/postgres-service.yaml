# Stable in-cluster DNS name for the database: `postgres`, which is what the backend's
# JDBC URL uses. ClusterIP, so there is no route from the internet -- reach it locally
# with `kubectl port-forward svc/postgres 5432:5432`.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
