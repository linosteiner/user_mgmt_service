# Disk for the database, provisioned as a DigitalOcean block-storage volume.
#
# Deleting this PVC deletes the database -- `kubectl delete -f k8s/postgres/` does
# exactly that.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
