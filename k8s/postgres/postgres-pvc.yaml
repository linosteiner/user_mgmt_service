# Disk for the database. Pods are disposable and their filesystem dies with them, so
# any state that must survive a restart needs a PersistentVolumeClaim.
#
# A PVC is a *request*: Kubernetes finds or provisions a matching PersistentVolume
# (on DigitalOcean, a block-storage volume) and binds it. `kubectl get pvc` shows
# Bound when that has happened.
#
# Deleting this PVC deletes the database. `kubectl delete -f k8s/postgres/` does
# exactly that -- see the teardown section in the README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
