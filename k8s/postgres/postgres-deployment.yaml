# The database pod. A Deployment rather than a StatefulSet is a simplification -- with
# replicas: 1 the behaviour is identical.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, and two Postgres processes
  # on one data directory would corrupt it anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            # A freshly attached DigitalOcean volume contains a lost+found directory,
            # and Postgres refuses to initialise into a non-empty directory -- so
            # PGDATA points at a subdirectory of the mount.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # envFrom takes every key as-is; no renaming needed here.
          envFrom:
            - secretRef:
                name: postgres-secret
            - configMapRef:
                name: postgres-config
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # Wrapped in `sh -c` so the container's shell expands the variables.
          # Kubernetes' own $(VAR) substitution only sees the `env:` list above, not
          # anything from envFrom, and would pass "$(POSTGRES_USER)" through literally.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
