# Non-secret Postgres settings. The postgres image reads POSTGRES_DB on first start
# and creates that database.
#
# The user-mgmt-service Deployment also reads this key (via configMapKeyRef) to build
# its JDBC URL, so the database name is defined in exactly one place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  POSTGRES_DB: user_mgmt_db
